name: Bug report
description: Report a reproducible problem in 3printer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve 3printer. Please provide enough detail to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which 3printer version are you using?
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      description: Include the OS version and architecture if known.
      placeholder: macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
