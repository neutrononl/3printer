name: Build release apps

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: ${{ !github.event.release.prerelease }}
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            os: macos
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            os: windows
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build macOS app bundle
        if: matrix.os == 'macos'
        shell: bash
        run: ./scripts/package-macos.sh '${{ matrix.target }}'
      - name: Archive macOS app
        if: matrix.os == 'macos'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: ditto -c -k --keepParent dist/3printer.app "3printer-${RELEASE_TAG}-${PLATFORM}.zip"
      - name: Build Linux app
        if: matrix.os == 'linux'
        shell: bash
        run: ./scripts/package-linux.sh '${{ matrix.target }}'
      - name: Archive Linux app
        if: matrix.os == 'linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: tar -czf "3printer-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C dist 3printer-linux
      - name: Build Windows app
        if: matrix.os == 'windows'
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Target '${{ matrix.target }}'
      - name: Archive Windows app
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: Compress-Archive -Path dist\3printer-windows -DestinationPath "3printer-$env:RELEASE_TAG-$env:PLATFORM.zip" -Force
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
          OS: ${{ matrix.os }}
        run: |
          if [[ "$OS" == linux ]]; then
            extension=tar.gz
          else
            extension=zip
          fi
          gh release upload "$RELEASE_TAG" "3printer-${RELEASE_TAG}-${PLATFORM}.${extension}" --clobber
