name: Build release apps

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build app bundle
        run: ./scripts/package-macos.sh
      - name: Create release archive
        run: ditto -c -k --keepParent dist/3printer.app "3printer-${{ github.event.release.tag_name }}-macos.zip"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "3printer-${{ github.event.release.tag_name }}-macos.zip" --clobber

  linux:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Linux app
        run: ./scripts/package-linux.sh
      - name: Create release archive
        run: tar -czf "3printer-${{ github.event.release.tag_name }}-linux.tar.gz" -C dist 3printer-linux
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "3printer-${{ github.event.release.tag_name }}-linux.tar.gz" --clobber

  windows:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows app
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path dist\3printer-windows -DestinationPath "3printer-${{ github.event.release.tag_name }}-windows.zip" -Force
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "3printer-${{ github.event.release.tag_name }}-windows.zip" --clobber
