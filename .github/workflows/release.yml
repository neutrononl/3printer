name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: ${{ !github.event.release.prerelease }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            binary: 3printer
            archive: 3printer-linux-x86_64.tar.gz
          - platform: macOS
            os: macos-latest
            binary: 3printer
            archive: 3printer-macos.tar.gz
          - platform: Windows
            os: windows-latest
            binary: 3printer.exe
            archive: 3printer-windows-x86_64.zip

    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C target/release "${{ matrix.binary }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.archive }}
