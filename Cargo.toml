[package]
name = "printer3"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "3printer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.15"
serde_json = "1"

serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

# objc 0.2 macros reference this legacy feature in the destination crate.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("cargo-clippy"))']
